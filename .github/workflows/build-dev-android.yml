name: Build Android Development (APK)

on:
  workflow_dispatch:

jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Libérer de l'espace sur le serveur
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          # Attention : Ne SURTOUT PAS remettre "cache: 'gradle'" ici

      - name: Installer les dépendances
        run: npm install

      - name: Générer le dossier Android (Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Compiler l'APK de développement
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Sauvegarder le fichier .apk
        uses: actions/upload-artifact@v4
        with:
          name: Ganbanaaxu-Dev-APK
          path: android/app/build/outputs/apk/debug/*.apk